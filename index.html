<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #1e293b;
        }
        header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin-bottom: 24px;
        }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }
        footer {
            text-align: center;
            padding: 16px;
            background-color: #1e293b;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Proyecto</h1>
        <a href="#contacto" class="btn">Empezar</a>
    </header>

    <main class="hero">
        <h2>Bienvenido a nuestra Landing Page</h2>
        <p>Solución moderna y optimizada desarrollada en equipo para presentar nuestros servicios digitales.</p>
        <a href="#contacto" class="btn">Conocer más</a>
    </main>

    <footer>
        <p>&copy; 2026 Equipo de Desarrollo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
